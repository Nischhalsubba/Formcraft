name: Bootstrap Nepal ERP suite

on:
  push:
    branches:
      - agent/nepal-erp-suite

permissions:
  contents: write

jobs:
  install-suite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/nepal-erp-suite
          fetch-depth: 0

      - name: Restore generated ERP source
        shell: bash
        run: |
          set -euo pipefail
          cat .erp-bootstrap/part-*.txt > /tmp/formcraft-erp.b64
          base64 --decode /tmp/formcraft-erp.b64 > /tmp/formcraft-erp.tar.gz
          tar -xzf /tmp/formcraft-erp.tar.gz -C .

      - name: Register ERP assets and quality gates
        shell: python
        run: |
          from pathlib import Path
          import json

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          css_line = '  <link rel="stylesheet" href="assets/css/erp-suite.css">\n'
          if 'assets/css/erp-suite.css' not in html:
              html = html.replace(
                  '  <link rel="stylesheet" href="assets/css/integrated-operations-routing.css">\n',
                  '  <link rel="stylesheet" href="assets/css/integrated-operations-routing.css">\n' + css_line,
              )
          scripts = (
              '  <script src="assets/js/erp-suite-schema.js" defer></script>\n'
              '  <script src="assets/js/erp-suite-ui.js" defer></script>\n'
              '  <script src="assets/js/erp-suite-workflows.js" defer></script>\n'
          )
          if 'assets/js/erp-suite-schema.js' not in html:
              html = html.replace(
                  '  <script src="assets/js/integrated-operations-actions.js" defer></script>\n',
                  '  <script src="assets/js/integrated-operations-actions.js" defer></script>\n' + scripts,
              )
          index.write_text(html, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          test_addition = ' && node tests/erp-suite-audit.mjs'
          if 'tests/erp-suite-audit.mjs' not in package['scripts']['test']:
              package['scripts']['test'] += test_addition
          syntax_items = [
              'node --check assets/js/erp-suite-schema.js',
              'node --check assets/js/erp-suite-ui.js',
              'node --check assets/js/erp-suite-workflows.js',
              'node --check tests/erp-suite-audit.mjs',
          ]
          for item in syntax_items:
              if item not in package['scripts']['test:syntax']:
                  package['scripts']['test:syntax'] += ' && ' + item
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

      - name: Remove one-time bootstrap payload
        shell: bash
        run: |
          rm -rf .erp-bootstrap
          rm -f .github/workflows/bootstrap-nepal-erp-suite.yml

      - name: Validate generated implementation
        shell: bash
        run: |
          npm run test:syntax
          npm test

      - name: Commit generated ERP suite
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Nepal-first ERP application suite'
          git push origin HEAD:agent/nepal-erp-suite
