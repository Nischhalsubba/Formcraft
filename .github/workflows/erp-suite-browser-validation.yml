name: ERP suite browser validation

on:
  pull_request:
    paths:
      - 'assets/js/erp-suite-*.js'
      - 'assets/css/erp-suite.css'
      - 'assets/js/workspace-architecture-v3*.js'
      - 'assets/css/workspace-architecture-v3*.css'
      - 'assets/js/premium-*.js'
      - 'assets/css/premium-*.css'
      - 'assets/js/responsive-system-v2.js'
      - 'assets/css/responsive-system-v2*.css'
      - 'assets/js/simplified-workspace-v4.js'
      - 'assets/css/simplified-workspace-v4.css'
      - 'assets/js/ui-theme-studio.js'
      - 'assets/css/ui-theme-studio.css'
      - 'assets/js/formcraft-bright-dashboard.js'
      - 'tests/erp-suite-*.py'
      - 'tests/erp-suite-*.mjs'
      - 'tests/workspace-architecture-v3-*.py'
      - 'tests/workspace-architecture-v3-*.mjs'
      - 'tests/premium-*.py'
      - 'tests/premium-*.mjs'
      - 'tests/responsive-system-*.py'
      - 'tests/responsive-system-*.mjs'
      - 'tests/simplified-workspace-*.py'
      - 'tests/simplified-workspace-*.mjs'
      - 'docs/PREMIUM_UI_E2E_AUDIT.md'
      - 'docs/RESPONSIVE_SYSTEM_AUDIT.md'
      - 'README.md'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/erp-suite-browser-validation.yml'
  push:
    branches:
      - main
      - agent/nepal-erp-suite
      - agent/premium-iconography-e2e
      - agent/responsive-system-audit
      - agent/simplified-shell-theme-studio
    paths:
      - 'assets/js/erp-suite-*.js'
      - 'assets/css/erp-suite.css'
      - 'assets/js/workspace-architecture-v3*.js'
      - 'assets/css/workspace-architecture-v3*.css'
      - 'assets/js/premium-*.js'
      - 'assets/css/premium-*.css'
      - 'assets/js/responsive-system-v2.js'
      - 'assets/css/responsive-system-v2*.css'
      - 'assets/js/simplified-workspace-v4.js'
      - 'assets/css/simplified-workspace-v4.css'
      - 'assets/js/ui-theme-studio.js'
      - 'assets/css/ui-theme-studio.css'
      - 'assets/js/formcraft-bright-dashboard.js'
      - 'tests/erp-suite-*.py'
      - 'tests/erp-suite-*.mjs'
      - 'tests/workspace-architecture-v3-*.py'
      - 'tests/workspace-architecture-v3-*.mjs'
      - 'tests/premium-*.py'
      - 'tests/premium-*.mjs'
      - 'tests/responsive-system-*.py'
      - 'tests/responsive-system-*.mjs'
      - 'tests/simplified-workspace-*.py'
      - 'tests/simplified-workspace-*.mjs'
      - 'docs/PREMIUM_UI_E2E_AUDIT.md'
      - 'docs/RESPONSIVE_SYSTEM_AUDIT.md'
      - 'README.md'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/erp-suite-browser-validation.yml'

concurrency:
  group: erp-suite-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SUPABASE_URL: https://formcraft-test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_formcraft_browser_test_key_1234567890
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and run static verification
        run: npm run build

      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Run ERP authenticated browser regression
        run: python tests/erp-suite-browser-smoke.py

      - name: Run workspace architecture browser regression
        run: python tests/workspace-architecture-v3-browser-smoke.py

      - name: Run premium interface browser regression
        run: python tests/premium-interface-browser-smoke.py

      - name: Run responsive system browser regression
        run: python tests/responsive-system-browser-smoke.py

      - name: Run simplified workspace browser regression
        run: python tests/simplified-workspace-browser-smoke.py
