name: ERP suite browser validation

on:
  pull_request:
    paths:
      - 'assets/js/erp-suite-*.js'
      - 'assets/css/erp-suite.css'
      - 'assets/js/workspace-architecture-v3*.js'
      - 'assets/css/workspace-architecture-v3*.css'
      - 'assets/js/premium-*.js'
      - 'assets/css/premium-*.css'
      - 'assets/js/responsive-system-v2.js'
      - 'assets/css/responsive-system-v2*.css'
      - 'assets/js/simplified-workspace-*.js'
      - 'assets/css/simplified-workspace-v4.css'
      - 'assets/js/ui-theme-studio.js'
      - 'assets/css/ui-theme-studio.css'
      - 'assets/js/form-modal-responsive.js'
      - 'assets/css/form-modal-responsive.css'
      - 'assets/js/form-workflow-*.js'
      - 'assets/css/form-workflow-enhancements.css'
      - 'assets/js/demo-data-system.js'
      - 'assets/css/demo-data-system.css'
      - 'assets/js/nepal-attendance-compliance.js'
      - 'assets/css/nepal-attendance-compliance.css'
      - 'assets/js/formcraft-bright-dashboard.js'
      - 'tests/erp-suite-*.py'
      - 'tests/erp-suite-*.mjs'
      - 'tests/workspace-architecture-v3-*.py'
      - 'tests/workspace-architecture-v3-*.mjs'
      - 'tests/premium-*.py'
      - 'tests/premium-*.mjs'
      - 'tests/presponsive-system-*.py'
      - 'tests/responsive-system-*.mjs'
      - 'tests/simplified-workspace-*.py'
      - 'tests/simplified-workspace-*.mjs'
      - 'tests/form-modal-*.py'
      - 'tests/form-modal-*.mjs'
      - 'tests/form-workflow-*.mjs'
      - 'tests/demo-data-*.py'
      - 'tests/demo-data-*.mjs'
      - 'tests/nepal-attendance-compliance-*.py'
      - 'tests/nepal-attendance-compliance-*.mjs'
      - 'docs/PREMIUM_UI_E2E_AUDIT.md'
      - 'docs/RESPONSIVE_SYSTEM_AUDIT.md'
      - 'docs/FORM_MODAL_E2E_AUDIT.md'
      - 'docs/DEMO_DATA_AND_FORM_WORKFLOWS.md'
      - 'docs/NEPAL_ATTENDANCE_COMPLIANCE.md'
      - 'README.md'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/erp-suite-browser-validation.yml'
  push:
    branches:
      - main
      - agent/nepal-erp-suite
      - agent/premium-iconography-e2e
      - agent/responsive-system-audit
      - agent/simplified-shell-theme-studio
      - agent/form-modal-responsive-e2e
      - agent/demo-data-form-workflows
      - agent/nepal-attendance-compliance
    paths:
      - 'assets/js/erp-suite-*.js'
      - 'assets/css/erp-suite.css'
      - 'assets/js/workspace-architecture-v3*.js'
      - 'assets/css/workspace-architecture-v3*.css'
      - 'assets/js/premium-*.js'
      - 'assets/css/premium-*.css'
      - 'assets/js/responsive-system-v2.js'
      - 'assets/css/responsive-system-v2*.css'
      - 'assets/js/simplified-workspace-*.js'
      - 'assets/css/simplified-workspace-v4.css'
      - 'assets/js/ui-theme-studio.js'
      - 'assets/css/ui-theme-studio.css'
      - 'assets/js/form-modal-responsive.js'
      - 'assets/css/form-modal-responsive.css'
      - 'assets/js/form-workflow-*.js'
      - 'assets/css/form-workflow-enhancements.css'
      - 'assets/js/demo-data-system.js'
      - 'assets/css/demo-data-system.css'
      - 'assets/js/nepal-attendance-compliance.js'
      - 'assets/css/nepal-attendance-compliance.css'
      - 'assets/js/formcraft-bright-dashboard.js'
      - 'tests/erp-suite-*.py'
      - 'tests/erp-suite-*.mjs'
      - 'tests/workspace-architecture-v3-*.py'
      - 'tests/workspace-architecture-v3-*.mjs'
      - 'tests/premium-*.py'
      - 'tests/premium-*.mjs'
      - 'tests/responsive-system-*.py'
      - 'tests/responsive-system-*.mjs'
      - 'tests/simplified-workspace-*.py'
      - 'tests/simplified-workspace-*.mjs'
      - 'tests/form-modal-*.py'
      - 'tests/form-modal-*.mjs'
      - 'tests/form-workflow-*.mjs'
      - 'tests/demo-data-*.py'
      - 'tests/demo-data-*.mjs'
      - 'tests/nepal-attendance-compliance-*.py'
      - 'tests/nepal-attendance-compliance-*.mjs'
      - 'docs/PREMIUM_UI_E2E_AUDIT.md'
      - 'docs/RESPONSIVE_SYSTEM_AUDIT.md'
      - 'docs/FORM_MODAL_E2E_AUDIT.md'
      - 'docs/DEMO_DATA_AND_FORM_WORKFLOWS.md'
      - 'docs/NEPAL_ATTENDANCE_COMPLIANCE.md'
      - 'README.md'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/erp-suite-browser-validation.yml'

permissions:
  contents: write

concurrency:
  group: erp-suite-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-hrms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.assemble.outputs.changed }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Assemble staged HRMS payload
        id: assemble
        shell: bash
        run: |
          if [ ! -f .hrms-payload/ready ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          import shutil
          import tarfile

          root = Path.cwd()
          payload_dir = root / '.hrms-payload'
          chunks = sorted(payload_dir.glob('chunk-*'))
          if not chunks:
              raise SystemExit('HRMS payload chunks are missing')
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in chunks)
          archive = payload_dir / 'payload.tar.gz'
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall(root, filter='data')

          ui_path = root / 'assets/js/hrms-suite-ui.js'
          ui_source = ui_path.read_text(encoding='utf-8')
          malformed = 'function tablive = device.last_seen_at && Date.now() - new Date(device.last_seen_at).getTime() < 300000;'
          corrected = 'const live = device.last_seen_at && Date.now() - new Date(device.last_seen_at).getTime() < 300000;'
          occurrence_count = ui_source.count(malformed)
          if occurrence_count != 1:
              raise SystemExit(f'Expected exactly one known HRMS UI syntax defect, found {occurrence_count}')
          ui_path.write_text(ui_source.replace(malformed, corrected, 1), encoding='utf-8')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          css_line = '  <link rel="stylesheet" href="assets/css/hrms-suite.css">\n'
          if css_line not in index:
              anchor = '  <link rel="stylesheet" href="assets/css/nepal-attendance-compliance.css">\n'
              if anchor not in index:
                  raise SystemExit('Could not locate Nepal compliance CSS anchor')
              index = index.replace(anchor, anchor + css_line)
          js_lines = ''.join([
              '  <script src="assets/js/hrms-xlsx.js" defer></script>\n',
              '  <script src="assets/js/hrms-suite-core.js" defer></script>\n',
              '  <script src="assets/js/hrms-suite-ui.js" defer></script>\n',
          ])
          if 'assets/js/hrms-suite-core.js' not in index:
              anchor = '  <script src="assets/js/nepal-attendance-compliance.js" defer></script>\n'
              if anchor not in index:
                  raise SystemExit('Could not locate Nepal compliance JS anchor')
              index = index.replace(anchor, anchor + js_lines)
          index_path.write_text(index, encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          def append_command(name, command):
              current = scripts.get(name, '')
              if command not in current:
                  scripts[name] = f'{current} && {command}' if current else command
          append_command('test', 'node tests/hrms-additive-audit.mjs')
          append_command('test:syntax', 'node --check assets/js/hrms-xlsx.js')
          append_command('test:syntax', 'node --check assets/js/hrms-suite-core.js')
          append_command('test:syntax', 'node --check assets/js/hrms-suite-ui.js')
          append_command('test:syntax', 'node --check tests/hrms-additive-audit.mjs')
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          workflow_path = root / '.github/workflows/erp-suite-browser-validation.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          path_anchor = "      - 'assets/js/nepal-attendance-compliance.js'\n"
          path_additions = ''.join([
              "      - 'assets/js/hrms-*.js'\n",
              "      - 'assets/css/hrms-suite.css'\n",
              "      - 'device-bridge/**'\n",
              "      - 'supabase/migrations/20260807170000_hrms_zkteco_bridge.sql'\n",
              "      - 'tests/hrms-*.py'\n",
              "      - 'tests/hrms-*.mjs'\n",
              "      - 'docs/HRMS_ZKTECO_INTEGRATION.md'\n",
          ])
          if "assets/js/hrms-*.js" not in workflow:
              if workflow.count(path_anchor) < 2:
                  raise SystemExit('Could not locate both ERP workflow path anchors')
              workflow = workflow.replace(path_anchor, path_anchor + path_additions)
          step_anchor = '      - name: Run Nepal attendance compliance regression\n'
          step = "      - name: Run additive HRMS regression\n        run: python tests/hrms-additive-browser-smoke.py\n\n"
          if 'Run additive HRMS regression' not in workflow:
              if step_anchor not in workflow:
                  raise SystemExit('Could not locate ERP browser test step anchor')
              workflow = workflow.replace(step_anchor, step + step_anchor)
          workflow_path.write_text(workflow, encoding='utf-8')

          gitignore_path = root / '.gitignore'
          gitignore = gitignore_path.read_text(encoding='utf-8')
          guards = ['.venv/', '__pycache__/', '.formcraft-bridge/', 'device-bridge/backups/']
          missing = [item for item in guards if item not in gitignore]
          if missing:
              gitignore += '\n# Local Python and Formcraft device-bridge runtime\n' + ''.join(f'{item}\n' for item in missing)
              gitignore_path.write_text(gitignore, encoding='utf-8')

          shutil.rmtree(payload_dir)
          (root / '.github/workflows/hrms-payload-apply.yml').unlink(missing_ok=True)
          PY

          node --check assets/js/hrms-xlsx.js
          node --check assets/js/hrms-suite-core.js
          node --check assets/js/hrms-suite-ui.js
          node --check tests/hrms-additive-audit.mjs
          python -m py_compile device-bridge/formcraft_bridge.py tests/hrms-additive-browser-smoke.py
          node tests/hrms-additive-audit.mjs

          git config user.name "Formcraft CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add additive HRMS and ZKTeco bridge suite"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  browser-validation:
    needs: assemble-hrms
    if: needs.assemble-hrms.outputs.changed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    env:
      SUPABASE_URL: https://formcraft-test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_formcraft_browser_test_key_1234567890
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and run static verification
        run: npm run build

      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Run ERP authenticated browser regression
        run: python tests/erp-suite-browser-smoke.py

      - name: Run workspace architecture browser regression
        run: python tests/workspace-architecture-v3-browser-smoke.py

      - name: Run premium interface browser regression
        run: python tests/premium-interface-browser-smoke.py

      - name: Run responsive system browser regression
        run: python tests/responsive-system-browser-smoke.py

      - name: Run simplified workspace browser regression
        run: python tests/simplified-workspace-browser-smoke.py

      - name: Run all-module form modal regression
        run: python tests/form-modal-browser-smoke.py

      - name: Run connected demo data and form workflow regression
        run: python tests/demo-data-form-workflows-browser-smoke.py

      - name: Run Nepal attendance compliance regression
        shell: bash
        run: |
          set +e
          python tests/nepal-attendance-compliance-browser-smoke.py 2>&1 | tee nepal-compliance-test.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload Nepal compliance test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepal-compliance-test-log
          path: nepal-compliance-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload demo-data visual snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-data-visual-snapshots
          path: test-artifacts/demo-data-visual-snapshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload Nepal compliance visual snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nepal-compliance-visual-snapshots
          path: test-artifacts/nepal-compliance-visual-snapshots
          if-no-files-found: error
          retention-days: 30
