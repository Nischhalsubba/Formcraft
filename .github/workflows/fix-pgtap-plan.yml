name: Reconcile pgTAP plan count

on:
  push:
    branches:
      - security/granular-erp-permissions
    paths:
      - .github/workflows/fix-pgtap-plan.yml

permissions:
  contents: write

jobs:
  fix-plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/granular-erp-permissions
      - name: Reconcile declared pgTAP plan and self-clean
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/select plan(20);/select plan(21);/' app/supabase/tests/erp_permissions_test.sql
          grep -F 'select plan(21);' app/supabase/tests/erp_permissions_test.sql
          rm .github/workflows/fix-pgtap-plan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: reconcile ERP authorization plan count'
          git push origin HEAD:security/granular-erp-permissions
