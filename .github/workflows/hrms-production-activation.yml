name: HRMS production activation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Supabase migration action
        required: true
        type: choice
        options:
          - preflight
          - apply
        default: preflight
      confirmation:
        description: Type APPLY_HRMS_ZKTECO_PRODUCTION only when action=apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hrms-production-activation
  cancel-in-progress: false

jobs:
  supabase-activation:
    name: Supabase HRMS activation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: fcyjcuykavxjwixfqann
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify activation inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260807170000_hrms_zkteco_bridge.sql
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing one or more required production secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD."
            exit 1
          fi
          if [ "${{ inputs.action }}" = "apply" ] && [ "${{ inputs.confirmation }}" != "APPLY_HRMS_ZKTECO_PRODUCTION" ]; then
            echo "Production apply requires the exact confirmation phrase APPLY_HRMS_ZKTECO_PRODUCTION."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize CLI metadata when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run | tee hrms-supabase-dry-run.log
          supabase migration list | tee hrms-supabase-migration-list-before.log

      - name: Apply pending migrations
        if: inputs.action == 'apply'
        run: supabase db push --yes

      - name: Verify migration state after apply
        if: inputs.action == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee hrms-supabase-migration-list-after.log

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrms-supabase-activation-evidence
          path: |
            hrms-supabase-dry-run.log
            hrms-supabase-migration-list-before.log
            hrms-supabase-migration-list-after.log
          if-no-files-found: warn
          retention-days: 30
