name: HRMS source repair

on:
  pull_request:
    paths:
      - 'tests/erp-suite-hrms-source-repair.py'
      - '.github/workflows/hrms-source-repair.yml'

permissions:
  contents: write

concurrency:
  group: hrms-source-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply focused HRMS source repairs
        run: python tests/erp-suite-hrms-source-repair.py

      - name: Validate repaired source
        shell: bash
        run: |
          node --check assets/js/hrms-xlsx.js
          node --check assets/js/hrms-suite-core.js
          node --check assets/js/hrms-suite-ui.js
          node --check tests/hrms-additive-audit.mjs
          python -m py_compile device-bridge/formcraft_bridge.py tests/hrms-additive-browser-smoke.py

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source repair changes were required."
            exit 0
          fi
          git config user.name "Formcraft CI"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/hrms-suite-ui.js
          git commit -m "Repair assembled HRMS UI source"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
