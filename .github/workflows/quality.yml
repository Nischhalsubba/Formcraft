name: Quality

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/quality.yml'
      - 'netlify.toml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/quality.yml'
      - 'netlify.toml'

permissions:
  contents: read

concurrency:
  group: formcraft-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_URL: https://formcraft-test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_formcraft_browser_test_key_1234567890
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build and run complete verification suite
        run: npm run build
