name: Record workspace validation

on:
  pull_request:
    paths:
      - 'assets/js/erp-suite-record-workspace.js'
      - 'assets/css/erp-suite-record-workspace.css'
      - 'tests/record-workspace-*'
      - 'docs/RECORD_WORKSPACE_AND_DRAFTS.md'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/record-workspace-validation.yml'
  push:
    branches:
      - main
      - agent/record-workspace-and-drafts
    paths:
      - 'assets/js/erp-suite-record-workspace.js'
      - 'assets/css/erp-suite-record-workspace.css'
      - 'tests/record-workspace-*'
      - 'docs/RECORD_WORKSPACE_AND_DRAFTS.md'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/record-workspace-validation.yml'

concurrency:
  group: record-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://formcraft-test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_formcraft_browser_test_key_1234567890
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and run static verification
        run: npm run build

      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Run record workspace regression
        run: python tests/record-workspace-browser-smoke.py

      - name: Upload record workspace visual snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: record-workspace-visual-snapshots
          path: test-artifacts/record-workspace-visual-snapshots
          if-no-files-found: error
          retention-days: 30
