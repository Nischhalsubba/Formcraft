name: Dynamic UI validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/dynamic-supabase-backend]

permissions:
  contents: read

jobs:
  ui-validation:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://formcraft-test.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_formcraft_browser_test_key_1234567890
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate runtime configuration
        run: npm run build
      - name: Check JavaScript syntax
        run: npm run test:syntax
      - name: Run static architecture checks
        run: npm test
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Run authenticated browser regression checks
        run: python tests/browser-smoke.py
