name: UI audit remediation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/maven-design-system]

permissions:
  contents: read

jobs:
  ui-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app-core.js
          node --check assets/js/app-pages.js
          node --check assets/js/app-actions.js
          node --check assets/js/app-modules.js
          node --check assets/js/final-ui-fixes.js
          node --check assets/js/header-popover-fixes.js
          node --check assets/js/maven-system.js
      - name: Run static UI audit checks
        run: npm test
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Run browser regression checks
        run: python tests/browser-smoke.py
