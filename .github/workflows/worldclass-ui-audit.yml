name: Worldclass UI Audit

on:
  pull_request:
    paths:
      - 'MASTER.md'
      - 'index.html'
      - 'package.json'
      - 'assets/css/formcraft-worldclass.css'
      - 'assets/js/header-popover-fixes.js'
      - 'assets/js/formcraft-worldclass.js'
      - 'assets/js/formcraft-atmosphere.js'
      - 'tests/worldclass-design-audit.mjs'
      - '.github/workflows/worldclass-ui-audit.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'MASTER.md'
      - 'index.html'
      - 'package.json'
      - 'assets/css/formcraft-worldclass.css'
      - 'assets/js/header-popover-fixes.js'
      - 'assets/js/formcraft-worldclass.js'
      - 'assets/js/formcraft-atmosphere.js'
      - 'tests/worldclass-design-audit.mjs'
      - '.github/workflows/worldclass-ui-audit.yml'

permissions:
  contents: read

jobs:
  worldclass-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate worldclass presentation runtime
        run: npm run test:worldclass
